<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannigan</title>
<style>
  /* Tokens. Dark is the default look (the person talks to Hannigan at any hour); light follows the OS or the toggle. */
  :root {
    --bg:#131211; --surface:#1c1b1a; --surface2:#262421; --fg:#f4f3f0; --muted:#9c9a94; --line:rgba(252,252,252,.10); --line2:rgba(252,252,252,.18);
    --accent:#7d9be0; --accent-fg:#0e1526; --ok:#5cc08a; --ng:#e8776f; --warn:#d7a84a; --warn-bg:rgba(215,168,74,.12); --sel:rgba(125,155,224,.14);
    --me:#2a2825; --shadow:0 12px 40px rgba(0,0,0,.35);
    --panel-w:360px; --col:760px; --top:56px;
  }
  :root[data-theme="light"] {
    --bg:#f7f6f3; --surface:#ffffff; --surface2:#edebe6; --fg:#171614; --muted:#6d6b66; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.16);
    --accent:#3457b8; --accent-fg:#ffffff; --ok:#1f7f47; --ng:#b8372f; --warn:#9a6b10; --warn-bg:rgba(215,168,74,.16); --sel:rgba(52,87,184,.10);
    --me:#e9e7e2; --shadow:0 12px 40px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f7f6f3; --surface:#ffffff; --surface2:#edebe6; --fg:#171614; --muted:#6d6b66; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.16);
      --accent:#3457b8; --accent-fg:#ffffff; --ok:#1f7f47; --ng:#b8372f; --warn:#9a6b10; --warn-bg:rgba(215,168,74,.16); --sel:rgba(52,87,184,.10);
      --me:#e9e7e2; --shadow:0 12px 40px rgba(0,0,0,.10);
    }
  }
  * { box-sizing:border-box; }
  html { color-scheme: dark light; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Inter", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; font-size:14px; font-weight:500; padding:7px 14px; border-radius:999px; border:1px solid var(--line2); background:transparent; color:var(--fg); cursor:pointer; line-height:1.3; }
  button:hover { background:var(--surface2); }
  button:disabled { opacity:.45; cursor:default; }
  button.allow { background:var(--ok); border-color:var(--ok); color:#07130c; } button.allow:hover { filter:brightness(1.08); }
  button.deny { color:var(--ng); border-color:var(--ng); } button.deny:hover { background:rgba(232,119,111,.12); }
  select { font:inherit; font-size:14px; padding:6px 30px 6px 12px; border-radius:999px; border:1px solid var(--line2); background:transparent; color:var(--fg); max-width:220px; appearance:none; -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position:calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size:5px 5px; background-repeat:no-repeat; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }

  /* top bar */
  header { position:sticky; top:0; z-index:5; height:var(--top); display:flex; align-items:center; gap:8px; padding:0 18px; flex-wrap:nowrap; white-space:nowrap; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .brand { display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0; }
  .mark { width:26px; height:26px; border-radius:50%; border:2px solid var(--fg); display:grid; place-items:center; font-size:12px; font-weight:700; letter-spacing:0; flex:none; }
  header b { font-size:16px; font-weight:600; letter-spacing:-.01em; }
  #conn { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #conn::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--muted); }
  #conn.on::before { background:var(--ok); }
  #pending { display:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:999px; background:var(--warn-bg); color:var(--warn); border:1px solid transparent; cursor:pointer; }
  .iconbtn { width:38px; height:38px; padding:0; display:grid; place-items:center; border-color:transparent; color:var(--muted); font-size:17px; }
  .iconbtn:hover { color:var(--fg); }
  #newConv { padding:7px 14px; }
  #settingsBtn { border-color:transparent; color:var(--muted); } #settingsBtn:hover { color:var(--fg); }
  header > * { flex:none; } #convSel { flex:0 1 auto; min-width:60px; }
  #newConv .short { display:none; }
  @media (max-width: 720px) { header { padding:0 10px; gap:6px; } header b, #conn { display:none; } #newConv .long { display:none; } #newConv .short { display:inline; } #newConv { width:38px; height:38px; padding:0; } #settingsBtn { padding:7px 10px; } #pending { padding:6px 9px; font-size:12px; } }

  /* columns */
  .layout { display:flex; align-items:flex-start; }
  main { flex:1; min-width:0; }
  .col { max-width:var(--col); margin:0 auto; padding:16px 20px 180px; }
  aside { width:var(--panel-w); flex:none; border-left:1px solid var(--line); padding:14px 18px 120px; position:sticky; top:var(--top); height:calc(100vh - var(--top)); overflow:auto; }
  @media (max-width: 1000px) {
    aside { display:none; position:fixed; inset:var(--top) 0 0 0; width:auto; height:auto; background:var(--bg); z-index:4; border:none; }
    aside.open { display:block; }
    footer { right:0 !important; }
  }
  @media (min-width: 1001px) { #panelBtn { display:none; } }

  /* conversation */
  .ev { margin:14px 0; white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--me); border-radius:20px 20px 6px 20px; padding:10px 16px; margin-left:auto; max-width:78%; width:fit-content; }
  .user .meta { text-align:right; }
  .secretary { padding:2px 0; }
  .secretary .label { color:var(--muted); font-weight:500; margin-bottom:4px; }
  .worker { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 16px; font-size:14px; max-width:92%; }
  .worker summary { cursor:pointer; color:var(--muted); font-size:13px; list-style:none; }
  .worker summary::-webkit-details-marker { display:none; }
  .worker summary::before { content:'▸ '; color:var(--muted); } .worker[open] summary::before { content:'▾ '; }
  .worker > div { margin-top:8px; }
  .approval { background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:16px; padding:12px 16px; }
  .approval .label { color:var(--warn); }
  .approval.closed { opacity:.55; border-left-color:var(--line2); }
  .approval pre { margin:8px 0 0; font-size:12.5px; white-space:pre-wrap; max-height:220px; overflow:auto; background:var(--bg); border-radius:10px; padding:8px 10px; }
  .sys { font-size:12.5px; color:var(--muted); padding:0; margin:6px 0; }
  .sys.error { color:var(--ng); }
  .meta { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .label { font-size:12.5px; font-weight:600; margin-bottom:2px; }
  .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; font-size:13px; color:var(--muted); align-items:center; }

  /* composer: a single rounded surface, centred in the column; in an empty conversation it sits in the middle of the page with the greeting */
  footer { position:fixed; bottom:0; left:0; right:var(--panel-w); z-index:6; padding:0 20px 18px; background:linear-gradient(to top, var(--bg) 60%, transparent); pointer-events:none; }
  footer > * { pointer-events:auto; }
  .composer { max-width:var(--col); margin:0 auto; background:var(--surface); border:1px solid var(--line2); border-radius:24px; box-shadow:var(--shadow); padding:12px 12px 10px 18px; }
  .composer textarea { display:block; width:100%; font:inherit; font-size:16px; line-height:1.5; min-height:28px; max-height:40vh; padding:4px 0; border:none; background:transparent; color:var(--fg); resize:none; }
  .composer textarea:focus { outline:none; }
  .composer textarea::placeholder { color:var(--muted); }
  .cbar { display:flex; align-items:center; gap:10px; margin-top:6px; }
  #target { font-size:12.5px; color:var(--muted); margin-right:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #send { width:36px; height:36px; padding:0; border-radius:50%; border:none; background:var(--accent); color:var(--accent-fg); font-size:16px; font-weight:700; display:grid; place-items:center; flex:none; }
  #send:hover { filter:brightness(1.1); }
  #hero { display:none; text-align:center; font-size:24px; font-weight:600; letter-spacing:-.02em; margin:0 0 22px; }
  body.empty footer { bottom:auto; top:50%; transform:translateY(-55%); background:none; padding-bottom:0; }
  body.empty #hero { display:block; }
  body.empty .composer { box-shadow:var(--shadow); }

  /* side panel */
  aside h3 { font-size:12.5px; margin:18px 0 8px; color:var(--muted); font-weight:600; }
  .wk { border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin:8px 0; background:var(--surface); }
  .wk .head { display:flex; gap:8px; align-items:center; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ng); flex:none; }
  .dot.on { background:var(--ok); }
  .role { font-size:12.5px; color:var(--muted); }
  .proj { margin-top:8px; font-size:13px; font-weight:600; }
  .row { margin-top:4px; padding:6px 8px; font-size:13px; cursor:pointer; border-radius:10px; }
  .row:hover, .row.sel { background:var(--sel); }
  .row.task { margin-left:14px; }
  .row .btns { margin-top:6px; } .row .btns button { font-size:12px; padding:3px 10px; }
  .st { font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--line2); margin-left:6px; white-space:nowrap; color:var(--muted); }
  .st.working, .st.starting { color:var(--accent); border-color:var(--accent); } .st.awaiting_approval, .st.awaiting_terminal { color:var(--warn); border-color:var(--warn); } .st.failed, .st.exited { color:var(--ng); }
  .tag { font-size:11px; color:var(--muted); border:1px solid var(--line2); border-radius:6px; padding:0 5px; margin-right:6px; }
  .alert { background:var(--warn-bg); border:1px solid var(--warn); border-radius:12px; padding:8px 12px; margin:6px 0; font-size:13px; }
  .alert b { color:var(--warn); }
  .oq { border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin:6px 0; font-size:12.5px; background:var(--surface); }

  /* thread view and settings */
  .thead { position:sticky; top:var(--top); background:var(--bg); padding:8px 0 10px; border-bottom:1px solid var(--line); z-index:3; }
  .thead .title { font-weight:600; margin-top:8px; }
  .dstate { font-size:12.5px; margin-top:4px; }
  .dstate .bad { color:var(--ng); } .dstate .good { color:var(--ok); } .dstate .wait { color:var(--warn); }
  .entry { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 16px; font-size:14px; max-width:92%; }
  .entry .label { color:var(--muted); font-weight:500; }
  .warnline { color:var(--ng); }
  #settings h2 { font-size:15px; font-weight:600; margin:26px 0 8px; letter-spacing:-.01em; }
  .card { border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:8px 0; background:var(--surface); }
  .field { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin:8px 0; font-size:14px; }
  .field > span:first-child { min-width:150px; color:var(--muted); font-size:13px; }
  .field input[type=text], .field input[type=number], .field textarea, .field select { flex:1; min-width:0; max-width:none; font:inherit; font-size:14px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); background:var(--bg); color:var(--fg); background-image:none; appearance:auto; -webkit-appearance:auto; }
  .field input[type=number] { flex:none; width:110px; }
  .field textarea { min-height:40px; resize:vertical; }
  .field input:read-only { color:var(--muted); }
  .field > .hint { flex:0 0 100%; padding-left:162px; margin-top:-2px; }
  .field input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  .hint { font-size:12.5px; color:var(--muted); }
  .guide ol { padding-left:20px; margin:6px 0; } .guide li { margin:8px 0; } .guide pre { margin:6px 0; padding:9px 12px; font-size:12.5px; background:var(--bg); border:1px solid var(--line); border-radius:10px; white-space:pre-wrap; word-break:break-all; }
  .proj-edit { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; }
  .proj-edit.new { background:var(--sel); border-radius:12px; padding:8px 10px; border-top:none; }
  .msg { font-size:13px; margin-top:8px; white-space:pre-wrap; word-break:break-word; }
  .msg.ng { color:var(--ng); } .msg.ok { color:var(--ok); }
  fieldset { border:none; margin:0; padding:0; min-width:0; }
  fieldset:disabled { opacity:.6; }
  details > summary { cursor:pointer; }
  @media (max-width: 600px) { .field > span:first-child { min-width:100%; } .field > .hint { padding-left:0; } .user { max-width:92%; } .col { padding:12px 14px 170px; } footer { padding:0 10px 10px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" id="mark">H</span><b id="appName">Hannigan</b><span id="conn">未接続</span></div>
  <span id="pending" title="未回答の承認へ移動"></span>
  <select id="convSel" title="会話の切り替え"></select>
  <button id="newConv" type="button" title="新しい会話"><span class="long">新しい会話</span><span class="short" aria-hidden="true">＋</span></button>
  <button id="settingsBtn" type="button">設定</button>
  <button id="themeBtn" class="iconbtn" type="button" title="配色を切り替える" aria-label="配色を切り替える">◐</button>
  <button id="panelBtn" class="iconbtn" type="button" title="スレッドを開く" aria-label="スレッドを開く">☰</button>
</header>
<div class="layout">
  <main><div class="col">
    <div id="log"></div>
    <div id="thread" style="display:none"></div>
    <div id="settings" style="display:none"></div>
  </div></main>
  <aside id="panel">
    <div id="alerts"></div>
    <h3>保留中の依頼</h3><div id="offline"><div class="role">なし</div></div>
    <h3>スレッド（ワーカー → 案件 → PM／子）</h3><div id="threads"></div>
    <h3><span class="secname">秘書</span>（会話ごと）</h3><div id="secretaries"></div>
  </aside>
</div>
<footer>
  <h1 id="hero">何を頼みますか？</h1>
  <form id="f" class="composer">
    <textarea id="t" rows="1" placeholder="秘書への指示（⌘Enter で送信）"></textarea>
    <div class="cbar"><div id="target"></div><button id="send" type="submit" aria-label="送信" title="送信（⌘Enter）">↑</button></div>
  </form>
</footer>
<script>
const hp = new URLSearchParams(location.hash.slice(1));
const store = { get(k){ try { return localStorage.getItem(k) } catch { return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} } };
let token = hp.get('token') || store.get('hn_token');
if (hp.get('token')) { store.set('hn_token', token); history.replaceState(null, '', location.pathname); }

const $ = id => document.getElementById(id);
const logEl = $('log'), threadEl = $('thread'), connEl = $('conn'), pendingEl = $('pending'), convSel = $('convSel');
const CONV_RE = /^[A-Za-z0-9_-]{1,64}$/;
let lastSeq = 0, es = null;
let state = { workers: [], approvals: [], threads: [], secretaries: [], offline_requests: [], leases: [], settings: {} };
const events = []; // everything received over SSE (bounded)
const openApprovals = new Set();
const closedApprovals = new Map(); // approval_id -> closed event
let view = { mode: 'chat' }; // or { mode:'thread', worker, session }

// ------------------------------------------------------------ conversations
function newConvId() { return 'c' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.random().toString(36).slice(2, 8); }
let convs = []; try { convs = JSON.parse(store.get('hn_convs') || '[]').filter(c => CONV_RE.test(c)); } catch { convs = []; }
let conv = store.get('hn_conv');
if (!conv || !CONV_RE.test(conv)) conv = convs[0] || newConvId();
function addConv(c) { if (CONV_RE.test(c) && !convs.includes(c)) { convs.unshift(c); store.set('hn_convs', JSON.stringify(convs.slice(0, 100))); renderConvSel(); } }
function renderConvSel() {
  convSel.textContent = '';
  for (const c of convs) { const o = document.createElement('option'); o.value = c; o.textContent = '会話 ' + c; if (c === conv) o.selected = true; convSel.append(o); }
}
function switchConv(c) { conv = c; store.set('hn_conv', c); addConv(c); renderConvSel(); view = { mode: 'chat' }; showView(); }
addConv(conv);
convSel.onchange = () => switchConv(convSel.value);
$('newConv').onclick = () => switchConv(newConvId());

// ------------------------------------------------------------ helpers
const t = ts => ts ? new Date(ts).toLocaleTimeString('ja-JP', { hour12:false }) : '';
const dt = ts => ts ? new Date(ts).toLocaleString('ja-JP', { hour12:false, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
const el = (tag, cls, text) => { const d = document.createElement(tag); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; };
const short = s => String(s || '').slice(0, 8);
const STATE_JA = { starting:'起動中', awaiting_terminal:'端末の確認待ち', ready:'待機中', working:'作業中', awaiting_approval:'承認待ち', stopping:'停止中', stopped:'停止', exited:'終了', failed:'失敗' };
const KIND_JA = { dev_channel_warning:'開発用チャネルの起動確認', workspace_trust:'フォルダの信頼確認', cu_app_approval:'Computer Use のアプリ承認', unknown:'端末の確認' };
// the secretary is shown under its configured name (hub.json secretary.persona.name, default Hannigan)
const secName = () => state.settings.secretary_name || 'Hannigan';
const ROLE_JA = { pm:'PM', task:'子', get secretary() { return secName(); } };
function applySecName() {
  const n = secName();
  document.title = n; $('appName').textContent = n; $('mark').textContent = n.slice(0, 1).toUpperCase(); $('hero').textContent = `${n}に何を頼みますか？`;
  for (const x of document.querySelectorAll('.secname')) x.textContent = n;
  if (view.mode === 'chat') { $('target').textContent = `宛先: ${n}（会話 ${conv}）`; ta.placeholder = `${n}への指示（⌘Enter で送信）`; }
}
const DELIV_JA = {
  accepted:'受付', queued:'Mac で配送待ち', worker_queued:'Mac で待機中', resource_wait:'資源待ち', delivered:'届けました（処理完了ではありません）',
  pending_offline:'保留中（Mac オフライン）', dispatching:'配送中', expired:'失効（実行されていません）', delivery_unknown:'配送不明（自動再送しません）',
  failed:'失敗', cancelled:'取消', not_applicable:'—',
};
const DELIV_CLS = { delivered:'good', expired:'bad', failed:'bad', delivery_unknown:'bad', cancelled:'bad', pending_offline:'wait', queued:'wait', worker_queued:'wait', resource_wait:'wait', dispatching:'wait' };
const REASON_JA = { cu_busy:'Computer Use 使用中', workspace_busy:'作業フォルダ使用中', resource_unknown:'資源の状態が不明', ttl_elapsed:'期限切れ', deadline_expired:'期限切れ', worker_offline:'ワーカー未接続' };
const wname = id => id === '_secretary' ? secName() : ((state.workers.find(w => w.worker === id) || {}).display_name || id);

function api(path, body) {
  return fetch(path, { method: body ? 'POST' : 'GET', headers: { 'content-type':'application/json', authorization:'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined })
    .then(r => r.json().then(j => Object.assign({ http: r.status }, j)).catch(() => ({ http: r.status, error: 'bad response' })));
}
function append(root, d) { const atBottom = innerHeight + scrollY >= document.body.scrollHeight - 80; root.append(d); if (root === logEl && !d.classList.contains('sys')) document.body.classList.remove('empty'); if (atBottom) d.scrollIntoView({ block:'end' }); }
function sys(root, text, err) { append(root, el('div', 'ev sys' + (err ? ' error' : ''), text)); }

// ------------------------------------------------------------ chat view (current conversation only)
function inChat(e) {
  switch (e.kind) {
    case 'user_message': case 'secretary_reply': return e.conv_id === conv;
    case 'worker_report': return !!e.routed && e.context_id === conv;
    case 'request_state': return e.context_id === conv && ['pending_offline','failed','delivery_unknown','delivered','worker_queued','resource_wait','cancelled'].includes(e.state);
    case 'request_expired': return e.context_id === conv;
    case 'notice': return !e.context_id || e.context_id === conv;
    case 'session_state': return e.worker === '_secretary' ? e.context_id === conv && (['failed','exited'].includes(e.state)) : (['failed','exited','stopped'].includes(e.state) || !!e.detail);
    case 'approval_open': case 'approval_closed': case 'approval_answered': case 'worker_link': case 'session_action': return true;
  }
  return false;
}
function renderChat(e) {
  const L = logEl;
  switch (e.kind) {
    case 'user_message': { const d = el('div', 'ev user', e.text); d.append(el('div', 'meta', `${t(e.ts)}`)); append(L, d); break; }
    case 'secretary_reply': { const d = el('div', 'ev secretary'); d.append(el('div', 'label', secName()), document.createTextNode(e.text), el('div', 'meta', t(e.ts))); append(L, d); break; }
    case 'worker_report': {
      const d = el('details', 'ev worker'); const s = el('summary', null, `${e.worker_name || e.worker} / ${e.project} の${ROLE_JA[e.role] || ''}からの報告 ${t(e.ts)}${e.request_id ? ' · ' + e.request_id : ''}`);
      d.append(s, el('div', null, e.text), el('div', 'meta', `session ${short(e.session)}`)); append(L, d); break; }

  const step = (title, body, cmd) => { const li = el('li'); li.append(el('b', null, title), el('div', 'hint', body)); if (cmd) { const pre = el('pre', null, cmd); li.append(pre); const bb = el('div', 'btns'); bb.append(copyBtn(() => cmd)); li.append(bb); } return li; };
  const a = el('ol');
  a.append(step('この画面でコードを発行する', '上の「ワーカーを追加」にワーカー ID・表示名・役割を入れて「コードを発行」。8 文字のコードと、相手の Mac で打つコマンド、Claude Code に貼るプロンプトが出ます。コードは 10 分で切れ、1 回だけ使えます'));
  if (!vps) {
    a.append(step('この Mac でリモートログインをオンにする', 'システム設定 > 一般 > 共有 > 「リモートログイン」。相手の Mac から SSH で入れるようにします'));
    if (sm.hostname) a.append(step('この Mac の名前と IP を控える', `${sm.user || ''}@${sm.hostname}${(sm.addresses || []).length ? '、IP ' + sm.addresses.join(' / ') : ''}。相手の Mac はこの名前か IP に SSH で届く必要があります（プロンプトには埋めてあります）`));
  }
  const li = el('li'); li.append(el('b', null, '相手の Mac で Claude Code を開き、プロンプトを貼る'),
    el('div', 'hint', `コードを発行したときに出たプロンプト（ID とコード入り）をそのまま貼ります。Claude がリポジトリの取得、${vps ? '' : 'SSH トンネル、'}ペアリング（scripts/pair.ts）、ワーカーの起動まで行い、各段階を報告します。Claude Code を使わないときは、プロンプト内のコマンドを上から順に自分で実行します`));
  const det = el('details'); det.append(el('summary', null, 'プロンプトの雛形（接続先は埋めてあります。ID とコードは発行時に入ります）'));
  det.append(el('pre', null, sm.prompt_template || '（ハブから雛形を取得できませんでした。「再読み込み」してください）'));
  const bb = el('div', 'btns'); bb.append(copyBtn(() => sm.prompt_template || '')); det.append(bb);
  li.append(det); a.append(li);
  a.append(step('この画面で確認して案件を足す', '右の「スレッド」に相手の Mac が表示名で、緑の点つきで出れば接続済み。「再読み込み」するとこの設定画面にその Mac の欄が出るので、そこから案件フォルダ（相手の Mac の中の場所）を登録します。以後は秘書が「役割」と「振り分けの判断基準」を見て使い分けます'));
  c.append(a);
  c.append(el('div', 'hint', `困ったとき: 「コードが違うか、期限が切れています」はコードの期限切れか使用済みなので発行し直します。相手の Mac が未接続のままなら、そちらの ~/.hannigan/logs/worker.log に connected to hub が出ているか${vps ? '' : '、tmux セッション hn-tunnel の ssh が生きているか'}を相手の Claude に確かめさせます。この Mac の hub.log に worker auth rejected が出たら鍵違いなので、secrets/worker-keys.json からその ID の行を消してからコードを発行し直します。ハブを再起動すると発行中のコードは全部失効します`));
  root.append(c);
}

// ------------------------------------------------------------ connection and input
function connect() {
  if (!token) { connEl.textContent = 'トークン未設定（URL の #token=… で開く）'; return; }
  es = new EventSource(`/api/events?since=${lastSeq}&token=${encodeURIComponent(token)}`);
  es.onopen = () => { connEl.textContent = '接続中'; connEl.classList.add('on'); loadState(); };
  es.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (err) { console.error(err); } };
  es.onerror = () => { connEl.textContent = '再接続待ち'; connEl.classList.remove('on'); if (es.readyState === 2) { es = null; setTimeout(connect, 3000); } };
}

const form = $('f'), ta = $('t');
ta.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); form.requestSubmit(); } });
const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, innerHeight * 0.4) + 'px'; }; ta.addEventListener('input', grow); grow();
form.onsubmit = ev => {
  ev.preventDefault(); const text = ta.value; if (!text.trim()) return;
  const msg_id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  if (view.mode === 'thread') {
    api('/api/thread/send', { worker: view.worker, session: view.session, msg_id, text }).then(r => {
      if (r.status) { ta.value = ''; grow(); if (r.status !== 'duplicate_ignored') applyDeliveryState({ kind: 'direct_delivery_state', message_id: msg_id, target_delivery: r.target_delivery || r.status, pm_notice_delivery: r.pm_notice_delivery, expires_at: r.expires_at, reason: r.error }); }
      else alert('送信できませんでした: ' + (r.message || r.error || JSON.stringify(r)));
    });
    return;
  }
  api('/api/send', { conv_id: conv, msg_id, text }).then(r => { if (r.status) { ta.value = ''; grow(); } else alert('送信できませんでした: ' + JSON.stringify(r)); });
};
renderConvSel(); showView(); connect();
</script>
